[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "deos-service"
version = "1.0.0"
description = "DEOS (Deep Extraction, Orchestration & Summarization) - Microservicio para procesamiento de audio y PDF"
authors = [
    {name = "DEOS Team", email = "deos@example.com"}
]
readme = "readme.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["fastapi", "whisper", "transcription", "summarization", "classification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "yt-dlp>=2024.10.22",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai-whisper>=20231117",
    "transformers>=4.30.0",
    "sentence-transformers>=2.2.0",
    "torch>=1.13.0",
    "torchvision>=0.14.0",
    "torchaudio>=0.13.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.10.0",
    "pdfplumber>=0.9.0",
    "reportlab>=4.0.0",
    "PyMuPDF>=1.20.0",
    "python-multipart>=0.0.5",
    "scikit-learn>=1.0.0",
    "numpy>=1.21.0",
    "tiktoken>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "isort>=5.10.0",
]

[project.urls]
Homepage = "https://github.com/tu-org/DEOS"
Documentation = "https://github.com/tu-org/DEOS/blob/main/readme.md"
Repository = "https://github.com/tu-org/DEOS.git"
Issues = "https://github.com/tu-org/DEOS/issues"

[project.scripts]
deos-server = "app.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88